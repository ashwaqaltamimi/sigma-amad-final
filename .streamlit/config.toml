# يثبّت الواجهة على الثيم الفاتح بصرف النظر عن الوضع الليلي في المتصفح/النظام.
# بدون هذا، يكتشف Streamlit الوضع الليلي ويلوّن مكوّناته الأصلية (رافع الملفات،
# الجداول، التبويبات، القوائم، حقل المحادثة) بنص فاتح يختفي على خلفيتنا البيضاء.
[theme]
base = "light"
primaryColor = "#1E7D58"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F9FC"
textColor = "#0E1C30"
